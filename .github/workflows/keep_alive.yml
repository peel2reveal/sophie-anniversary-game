name: Keep Streamlit App Alive

on:
  schedule:
    # Runs at 00:00 UTC every Wednesday (Once a week)
    - cron: '0 0 * * 3'
  workflow_dispatch: # Allows you to trigger this manually

jobs:
  keep_alive:
    runs-lines: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push empty commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git commit --allow-empty -m "Chore: Keep-alive ping for Streamlit Cloud"
          git push
